<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>SEEDED</title></head>
<body>
<script>
  // GUI 测试环境预置页：通过 URL 参数写入/清理 localStorage（同源共享）
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode");
  const now = Date.now();
  const H = 3600000;

  function draft(ageMs) {
    return {
      id: "draft-seed-" + mode,
      date: new Date(now).toISOString().slice(0, 10),
      exercises: [{
        id: "ex-seed",
        bodyPart: "胸部",
        exercise: "卧推",
        sets: [
          { id: "set-seed-1", weight: 60, reps: 10, durationSeconds: 45, startedAt: now - ageMs, finishedAt: now - ageMs + 45000 },
          { id: "set-seed-2", weight: 60, reps: 8, durationSeconds: 40, startedAt: now - ageMs + 300000, finishedAt: now - ageMs + 340000 },
        ],
      }],
      calories: 0,
      createdAt: new Date(now - ageMs - 3600000).toISOString(),
      startedAt: now - ageMs,
    };
  }

  if (params.get("clean")) {
    ["fitlog.workouts", "fitlog.draftWorkout", "fitlog.customExercises", "fitlog.chatMessages"].forEach((k) => localStorage.removeItem(k));
  }

  if (mode === "fresh") {
    localStorage.setItem("fitlog.draftWorkout", JSON.stringify(draft(2 * H)));
  } else if (mode === "stale") {
    localStorage.setItem("fitlog.draftWorkout", JSON.stringify(draft(7 * H)));
  } else if (mode === "corrupt") {
    localStorage.setItem("fitlog.draftWorkout", "{not valid json!!");
  }
</script>
<pre id="status">seeded:</pre>
<script>document.getElementById("status").textContent = "seeded:" + mode;</script>
</body>
</html>
